# =============================================
# DOCKER COMPOSE — ProjectMaster Full Stack
# =============================================
# 
# Cách sử dụng:
#   docker-compose up --build        # Build và chạy lần đầu
#   docker-compose up -d             # Chạy nền (detach)
#   docker-compose down              # Dừng tất cả
#   docker-compose logs -f backend   # Xem log backend
#
# Truy cập ứng dụng:
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:5000
# =============================================

version: '3.9'

services:

  # ── Backend: Node.js + Express ──────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: projectmaster-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist uploaded files
      - backend_uploads:/app/uploads
    networks:
      - projectmaster-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend: React + Nginx ─────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: projectmaster-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - projectmaster-net

# ── Volumes ────────────────────────────────────
volumes:
  backend_uploads:
    driver: local

# ── Networks ───────────────────────────────────
networks:
  projectmaster-net:
    driver: bridge
